[build]
  command = "npm ci && npm run build"
  publish = "dist"

# The service worker must never be cached by the CDN/browser, or updates would not be detected.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
